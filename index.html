<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bible" />
    <title>Bible Assistant</title>
    <!--
      Park an early install event. `beforeinstallprompt` can fire before
      /src/main.tsx runs at all: module scripts are deferred, so on a warm visit
      Chrome can decide the app is installable while the document is still
      parsing. Nothing re-fires the event on request, so a listener added by the
      bundle would simply have missed it — and `?install=1` would then fall
      through to written instructions on the one browser that has a real dialog.

      preventDefault() also suppresses Chrome's own mini-infobar, which is the
      normal thing to do when the app offers its own install affordance.
      src/lib/pwaInstall.ts adopts whatever is parked here and keeps its own
      listener for events that arrive later.
    -->
    <script>
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
